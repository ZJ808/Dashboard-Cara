[theme]
base            = "dark"
primaryColor    = "#00c8ff"
backgroundColor = "#0d1117"
secondaryBackgroundColor = "#161b22"
textColor       = "#e6edf3"
font            = "monospace"

[server]
headless        = true
enableCORS      = false
enableXsrfProtection = true
maxUploadSize   = 200

[browser]
gatherUsageStats = false
